name: Build Electron Windows ARM64

on:
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16 # 或者项目要求的版本
          cache: 'yarn'
      # --- 新增步骤开始 ---
      - name: Fix package.json dependencies
        run: |
          node -e "let p=require('./package.json'); ['electron', 'electron-builder'].forEach(k=>{if(p.dependencies && p.dependencies[k]){p.devDependencies=p.devDependencies||{}; p.devDependencies[k]=p.dependencies[k]; delete p.dependencies[k]}}); require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2))"
      # --- 新增步骤结束 ---
      - name: Install dependencies
        run: yarn install --ignore-engines
      - name: Install dependencies
        run: yarn install

      - name: Create .env file
        # 模拟你的 cp .env.example .env 指令
        run: copy .env.example .env

      - name: Build Windows ARM64
        # 假设你的 package.json 中有 build 脚本。
        # 如果没有，可以直接运行 node_modules/.bin/electron-builder --win --arm64
        run: yarn electron-builder --win --arm64 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electron-Win-ARM64
          path: dist/*.exe # 根据你项目实际生成目录调整（通常是 dist 或 out）
