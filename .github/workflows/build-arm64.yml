name: Build YesPlayMusic Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
      YARN_IGNORE_ENGINES: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Fix package.json dependencies
        run: |
          node -e "let p=require('./package.json'); ['electron', 'electron-builder'].forEach(k=>{if(p.dependencies && p.dependencies[k]){p.devDependencies=p.devDependencies||{}; p.devDependencies[k]=p.dependencies[k]; delete p.dependencies[k]}}); require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2))"

      - name: Install dependencies
        # 这里是核心：强制指向 Electron 的 ARM64 库文件
        run: yarn install --ignore-engines
      - name: Install Windows ARM64 native dependency
        run: yarn add --ignore-engines --ignore-platform --ignore-optional @unblockneteasemusic/rust-napi-win32-arm64-msvc@0.4.0

      - name: Create .env file
        run: |
          if (Test-Path .env.example) { copy .env.example .env }

      - name: Build Web Code
        run: yarn --ignore-engines run build

      - name: Build Windows ARM64
        run: yarn --ignore-engines run electron:build --win --arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: arm64
          # 再次确保打包时也使用这些参数
          npm_config_target: 13.6.9
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YesPlayMusic-Win-ARM64
          path: |
            dist/*.exe
            dist_electron/*.exe
